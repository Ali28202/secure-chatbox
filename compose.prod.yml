name: secure-chatbox-prod

x-database-url: &database-url
  DATABASE_URL: postgresql://${POSTGRES_USER:-chatbox}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-chatbox}?schema=public

services:
  db:
    image: postgres:18-alpine
    container_name: chatbox-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-chatbox}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [internal]

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: secure-chatbox-api:latest
    working_dir: /app/packages/database
    command: ['bunx', '--bun', 'prisma', 'migrate', 'deploy', '--config', './prisma.config.ts']
    environment: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: secure-chatbox-api:latest
    container_name: chatbox-prod-api
    restart: unless-stopped
    environment:
      <<: *database-url
      NODE_ENV: production
      API_PORT: 3001

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-900}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-604800}

      COOKIE_SECURE: ${COOKIE_SECURE:-false}

      CORS_ORIGINS: ${PUBLIC_ORIGIN:-}

      ALLOWED_IP_RANGES: 172.28.0.0/16,127.0.0.1,::1

      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_URL_TTL: ${S3_URL_TTL:-300}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ''
    image: secure-chatbox-web:latest
    container_name: chatbox-prod-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks: [internal]

  metabase-init:
    image: postgres:18-alpine
    container_name: chatbox-prod-metabase-init
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-chatbox}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: postgres
    volumes:
      - ./infra/metabase/init.sql:/init.sql:ro
    command: >-
      psql -v ON_ERROR_STOP=1
           -v app_database=${POSTGRES_DB:-chatbox}
           -v metabase_database=${METABASE_DB:-metabase}
           -v ro_role=${METABASE_RO_USER:-metabase_ro}
           -v ro_password=${METABASE_RO_PASSWORD:?set METABASE_RO_PASSWORD in .env}
           -f /init.sql
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: 'no'
    networks: [internal]

  metabase:
    image: metabase/metabase:v0.63.13
    container_name: chatbox-prod-metabase
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: ${METABASE_DB:-metabase}
      MB_DB_USER: ${POSTGRES_USER:-chatbox}
      MB_DB_PASS: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      MB_ENCRYPTION_SECRET_KEY: ${METABASE_ENCRYPTION_KEY:?set METABASE_ENCRYPTION_KEY in .env}

      JAVA_OPTS: ${METABASE_JAVA_OPTS:--Xmx1g}
    depends_on:
      db:
        condition: service_healthy
      metabase-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '--fail', '-s', '-o', '/dev/null', 'http://localhost:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks: [internal]

  nginx:
    image: nginx:1.29-alpine
    container_name: chatbox-prod-nginx
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${METABASE_PORT:-8080}:8080'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks: [internal]

volumes:
  db-data:

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/16
