name: secure-chatbox-prod

x-database-url: &database-url
  DATABASE_URL: postgresql://${POSTGRES_USER:-chatbox}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-chatbox}?schema=public

services:
  db:
    image: postgres:18-alpine
    container_name: chatbox-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-chatbox}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [internal]

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: secure-chatbox-api:latest
    working_dir: /app/packages/database
    command: ['bunx', '--bun', 'prisma', 'migrate', 'deploy', '--config', './prisma.config.ts']
    environment: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: secure-chatbox-api:latest
    container_name: chatbox-prod-api
    restart: unless-stopped
    environment:
      <<: *database-url
      NODE_ENV: production
      API_PORT: 3001

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-900}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-604800}

      # TLS is mandatory in this deployment, so this defaults to on. Setting it
      # false over HTTPS is harmless; setting it true over plain HTTP makes login
      # appear to succeed and every following request arrive unauthenticated.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}

      # Both CORS *and* the CSRF origin check read this, so it has to be the
      # exact scheme+host a browser will send in `Origin`. Wrong here and every
      # POST fails while every GET works, which is a confusing way to be broken.
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-https://${DOMAIN}}

      # Not the public allow list — nginx is the front door now. This says the
      # API accepts nothing that did not come through the compose network, so
      # the container cannot be reached directly even if its port is exposed.
      ALLOWED_IP_RANGES: 172.28.0.0/16,127.0.0.1,::1

      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_URL_TTL: ${S3_URL_TTL:-300}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ''
    image: secure-chatbox-web:latest
    container_name: chatbox-prod-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks: [internal]

  metabase-init:
    image: postgres:18-alpine
    container_name: chatbox-prod-metabase-init
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-chatbox}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: postgres
    volumes:
      - ./infra/metabase/init.sql:/init.sql:ro
    command: >-
      psql -v ON_ERROR_STOP=1
           -v app_database=${POSTGRES_DB:-chatbox}
           -v metabase_database=${METABASE_DB:-metabase}
           -v ro_role=${METABASE_RO_USER:-metabase_ro}
           -v ro_password=${METABASE_RO_PASSWORD:?set METABASE_RO_PASSWORD in .env}
           -f /init.sql
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: 'no'
    networks: [internal]

  metabase:
    image: metabase/metabase:v0.63.13
    container_name: chatbox-prod-metabase
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: ${METABASE_DB:-metabase}
      MB_DB_USER: ${POSTGRES_USER:-chatbox}
      MB_DB_PASS: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      MB_ENCRYPTION_SECRET_KEY: ${METABASE_ENCRYPTION_KEY:?set METABASE_ENCRYPTION_KEY in .env}

      # Metabase builds absolute links (password resets, alerts, dashboard
      # subscriptions) from this. Left unset it guesses from the request and
      # emails out http://localhost links that go nowhere.
      MB_SITE_URL: https://${METABASE_DOMAIN:?set METABASE_DOMAIN in .env}

      JAVA_OPTS: ${METABASE_JAVA_OPTS:--Xmx1g}
    depends_on:
      db:
        condition: service_healthy
      metabase-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '--fail', '-s', '-o', '/dev/null', 'http://localhost:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks: [internal]

  nginx:
    image: nginx:1.29-alpine
    container_name: chatbox-prod-nginx
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      # Bound to loopback on purpose: analytics is reached over an SSH tunnel,
      # not published. See infra/nginx/templates/metabase.conf.template.
      - '127.0.0.1:${METABASE_PORT:-8080}:8080'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env — the public hostname, e.g. chat.example.com}
      METABASE_DOMAIN: ${METABASE_DOMAIN:?set METABASE_DOMAIN in .env — the analytics hostname, e.g. panel.example.com}
      # Without this, envsubst would also expand nginx's own runtime variables
      # ($host, $remote_addr) to empty strings and the config would be nonsense.
      # Anchored so it matches these two names and nothing that merely contains them.
      NGINX_ENVSUBST_FILTER: '^(DOMAIN|METABASE_DOMAIN)$$'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Rendered into /etc/nginx/conf.d by the image's entrypoint.
      - ./infra/nginx/templates:/etc/nginx/templates:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
    # The image's entrypoint only renders templates when its first argument is
    # literally `nginx` (see the `if` at the top of /docker-entrypoint.sh), and
    # the reload loop below needs a shell — so the render is invoked by hand.
    # Drop that call and nginx comes up with an empty conf.d and serves nothing.
    #
    # Then: remove the stock welcome server, which now survives because we mount
    # `templates` instead of replacing `conf.d`; reload every 6 hours so a
    # certificate certbot renewed underneath us is picked up; stay in foreground.
    command: >-
      sh -c '/docker-entrypoint.d/20-envsubst-on-templates.sh &&
             rm -f /etc/nginx/conf.d/default.conf;
             while :; do sleep 6h & wait $${!}; nginx -s reload; done &
             exec nginx -g "daemon off;"'
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks: [internal]

  # Renewal only. The *first* certificate is issued by the one-off standalone
  # command in the runbook, before this stack has ever run — nginx will not
  # start without one, so it cannot be the thing that serves the first challenge.
  certbot:
    image: certbot/certbot:latest
    container_name: chatbox-prod-certbot
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: >-
      sh -c 'trap exit TERM; while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done'
    networks: [internal]

volumes:
  db-data:
  letsencrypt:
  certbot-webroot:

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/16
