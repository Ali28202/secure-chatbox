name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Lint the workspaces
        run: bun run lint

      - name: Lint the end-to-end suite
        run: bun run lint:e2e

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Typecheck the workspaces
        run: bun run typecheck

      - name: Typecheck the end-to-end suite
        run: bun run typecheck:e2e

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: chatbox
          POSTGRES_PASSWORD: chatbox_dev_pw
          POSTGRES_DB: chatbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Start a bucket
        run: |
          docker run -d --name chatbox-ci-s3 -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            --entrypoint sh minio/minio:RELEASE.2025-09-07T16-13-09Z \
            -c 'mkdir -p /data/chatbox-e2e && exec minio server /data'
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          echo 'MinIO never became healthy'; docker logs chatbox-ci-s3; exit 1

      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run the end-to-end suite
        run: bun run test:e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/.artifacts/
          retention-days: 7
