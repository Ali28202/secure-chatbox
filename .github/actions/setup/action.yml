name: Prepare the workspace
description: >
  Bun, the dependency cache, the workspaces and the generated Prisma client —
  everything each job in the CI workflow needs before it can run its first
  command. Written once here because three jobs need the same five steps, and
  GitHub Actions has no YAML anchors to share them with.

runs:
  using: composite
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@v2

    - name: Restore the dependency cache
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Write the environment file
      shell: bash
      run: |
        grep -vE '^JWT_(ACCESS|REFRESH)_SECRET=' .env.example > .env
        {
          echo "JWT_ACCESS_SECRET=$(openssl rand -base64 48)"
          echo "JWT_REFRESH_SECRET=$(openssl rand -base64 48)"
        } >> .env

    - name: Generate the Prisma client
      shell: bash
      run: bun --filter='@repo/database' db:generate
