name: secure-chatbox

services:
  db:
    image: postgres:18-alpine
    container_name: chatbox-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatbox_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-chatbox}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  metabase-init:
    image: postgres:18-alpine
    container_name: chatbox-metabase-init
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-chatbox}
      PGPASSWORD: ${POSTGRES_PASSWORD:-chatbox_dev_pw}
      PGDATABASE: postgres
    volumes:
      - ./infra/metabase/init.sql:/init.sql:ro
    command: >-
      psql -v ON_ERROR_STOP=1
           -v app_database=${POSTGRES_DB:-chatbox}
           -v metabase_database=${METABASE_DB:-metabase}
           -v ro_role=${METABASE_RO_USER:-metabase_ro}
           -v ro_password=${METABASE_RO_PASSWORD:-metabase_ro_dev_pw}
           -f /init.sql
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  metabase:
    image: metabase/metabase:v0.63.13
    container_name: chatbox-metabase
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: ${METABASE_DB:-metabase}
      MB_DB_USER: ${POSTGRES_USER:-chatbox}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-chatbox_dev_pw}

      MB_ENCRYPTION_SECRET_KEY: ${METABASE_ENCRYPTION_KEY:-chatbox_dev_metabase_key_change_me}

      JAVA_OPTS: ${METABASE_JAVA_OPTS:--Xmx1g}
    ports:
      - '${METABASE_PORT:-8080}:3000'
    depends_on:
      db:
        condition: service_healthy
      metabase-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '--fail', '-s', '-o', '/dev/null', 'http://localhost:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

volumes:
  db-data:
