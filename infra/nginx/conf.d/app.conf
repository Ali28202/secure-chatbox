# The single origin.
#
# This is the whole point of putting nginx in front: the browser talks to one
# host and one port, so `/api/...` and `/socket.io/` are same-origin requests.
# CORS never fires, the session cookies are plain first-party cookies, and
# `NEXT_PUBLIC_API_URL` is the empty string.
#
# It is also the only thing listening on the network. Neither `api` nor `web`
# publishes a port in compose.prod.yml; they are reachable by service name on
# the internal network and by nothing else.

upstream web_upstream {
    server web:3000;
    # Without keepalive, every proxied request opens a fresh TCP connection to
    # the upstream. The connection cache needs HTTP/1.1 and an empty
    # `Connection` header on the proxied request — both set in the locations.
    keepalive 32;
}

upstream api_upstream {
    server api:3001;
    keepalive 32;
}

server {
    listen      80 default_server;
    server_name _;

    # -----------------------------------------------------------------------
    # The gate this platform exists for
    # -----------------------------------------------------------------------
    # Academic conversations stay on the university network. Everything else
    # gets a 403 before it reaches an application at all.
    #
    # Order matters: nginx evaluates allow/deny top to bottom and stops at the
    # first match, so `deny all` must come last.
    #
    # $remote_addr is the client's real address even though nginx is in a
    # container: Docker publishes port 80 with a DNAT rule, which rewrites the
    # destination and leaves the source alone. A request from a laptop at
    # 192.168.1.40 arrives here as 192.168.1.40.
    #
    # 127.0.0.1 is for a request made on the server itself — `curl localhost`
    # during a deployment check. That one does *not* keep its source address:
    # Docker's userland proxy relays host-local traffic and the packet arrives
    # from the bridge gateway (a 172.x address), so a loopback check from the
    # host is refused by this list. That is not a bug to work around by opening
    # 172.16.0.0/12 — doing so would admit every container on the machine.
    # Check from a machine on the LAN, which is what the rule is about.
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny  all;

    # The API is not a browser-facing document server; nothing it returns
    # should ever be sniffed into a different type or framed by another page.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        SAMEORIGIN  always;
    add_header Referrer-Policy        same-origin always;

    # -----------------------------------------------------------------------
    # Realtime
    # -----------------------------------------------------------------------
    # Before /api/ and / because engine.io's path is its own: index.ts dispatches
    # /socket.io/ to the Bun engine before Hono ever sees the request, so this
    # cannot be folded into the API location.
    location /socket.io/ {
        proxy_pass http://api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An idle WebSocket sends nothing, and the 60s default reads that as a
        # dead connection and closes it. A conversation nobody has typed in for
        # a minute is the normal state of a chat application, so this must
        # comfortably exceed the engine's own 25s ping interval — an hour does.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # engine.io opens with HTTP long-polling before upgrading. Buffering
        # holds each poll's response until nginx decides it has enough, which
        # turns realtime delivery into whatever the buffer feels like.
        proxy_buffering off;
    }

    # -----------------------------------------------------------------------
    # API
    # -----------------------------------------------------------------------
    location /api/ {
        # No trailing slash on the upstream, and that single character is the
        # whole contract: with one, nginx would replace the matched `/api/`
        # prefix and the API — which mounts its routes *at* /api — would see
        # /auth/login and answer 404.
        proxy_pass http://api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long enough for an attachment upload to finish being read.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_request_buffering on;
    }

    # -----------------------------------------------------------------------
    # Web
    # -----------------------------------------------------------------------
    # Next's build output is content-addressed — every file under this path
    # carries a hash in its name, so it is safe to cache until the heat death of
    # the university and a rebuild simply produces different names.
    location /_next/static/ {
        proxy_pass http://web_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://web_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
