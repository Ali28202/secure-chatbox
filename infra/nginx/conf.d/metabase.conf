# Analytics, behind the same front door.
#
# A second listener rather than a `/metabase` location on :80, and that is not a
# stylistic choice: Metabase cannot be served from a URL subpath. It builds its
# own asset and API URLs from the root, so a `location /metabase/` would load
# the page and then fetch every script from `/app/...` — off the location and
# into the Next app, which answers 404. Its own port is the supported shape.
#
# What it shares with app.conf is the part that matters: the same allow list, so
# the dashboards are reachable from the campus network and from nowhere else,
# and the same single point of entry, because `metabase` publishes no port of
# its own in compose.prod.yml.

server {
    listen      8080;
    server_name _;

    # Identical to app.conf's, and for the same reason. Analytics over this
    # platform's data is not less sensitive than the platform — it is the same
    # data, aggregated, plus a login of its own that someone will pick a weak
    # password for.
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny  all;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy        same-origin always;

    # Deliberately no X-Frame-Options: Metabase sets its own frame policy, and
    # `always` here would add a second, conflicting header that some browsers
    # resolve by refusing to render the dashboards at all.

    # A dashboard's CSV export is a response body of arbitrary size.
    client_max_body_size 100m;

    # Resolved at request time, not at startup.
    #
    # nginx normally resolves upstream names once, when the config is loaded,
    # and refuses to start if one does not resolve. That would mean a stopped or
    # never-deployed Metabase takes the whole platform down with it — nginx
    # would fail to start, and :80 would be gone along with :8080. Naming the
    # upstream through a variable defers the lookup to each request, so the
    # worst case here is a 502 on this port while everything else serves.
    #
    # 127.0.0.11 is Docker's embedded DNS server, the same one that resolves
    # `api` and `web` in app.conf.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        set $metabase_upstream http://metabase:3000;
        proxy_pass $metabase_upstream;

        proxy_http_version 1.1;

        # Metabase's query notifications and its dashboard auto-refresh both run
        # over a WebSocket.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A question that scans a term's worth of messages is a slow query by
        # nature, and the person who wrote it is watching a spinner, not a
        # timeout. Metabase enforces its own limit long before this one.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
