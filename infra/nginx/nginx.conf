# Main nginx configuration. The server block lives in conf.d/app.conf, which
# this file includes at the bottom — the split is the stock nginx layout, kept
# so that the part a deployment actually edits (hosts, ports, the allow list) is
# one short file and not buried in boilerplate.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $remote_addr is the real client on this deployment: nginx is the edge and
    # nothing sits in front of it, so there is no X-Forwarded-For to prefer and
    # no real_ip_from to configure. Logging it is what makes a refusal by the
    # allow list below explainable after the fact.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Hides the exact nginx version from error pages and the Server header.
    server_tokens  off;

    # Above the API's own 51 MB request ceiling (five 10 MB attachments plus a
    # megabyte for the multipart envelope), and deliberately so. Matching it
    # exactly would make the two limits race, and whoever lost would answer with
    # nginx's English HTML error page instead of the API's Persian one. A body
    # this size is meant to reach the API and be refused there, in a language
    # the person reading it speaks.
    client_max_body_size  52m;

    # An upload arriving over campus wifi is slow; the 60s default closes it
    # mid-transfer and the browser reports a network error with nothing to show
    # for the four minutes it spent.
    client_body_timeout   300s;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      text/javascript application/x-javascript image/svg+xml
                      font/woff2 application/font-woff2;

    # The WebSocket upgrade dance, as a map rather than a literal: a proxied
    # request must send `Connection: upgrade` only when the client asked for an
    # upgrade, and `Connection: close` otherwise. Hardcoding `upgrade` on a
    # location that also serves ordinary polling requests breaks the polling.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
