user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    server_tokens  off;

    client_max_body_size  52m;

    client_body_timeout   300s;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      text/javascript application/x-javascript image/svg+xml
                      font/woff2 application/font-woff2;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Applied to the login and register endpoints only, in app.conf. 30 requests
    # per minute per address is far more than a person types and far less than a
    # script wants. 10m of state holds roughly 160k addresses.
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=30r/m;

    include /etc/nginx/conf.d/*.conf;
}
